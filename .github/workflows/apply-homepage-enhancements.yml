name: Apply homepage enhancements

on:
  push:
    branches: [main]
    paths:
      - 'homepage-enhancements.js'
      - '.github/workflows/apply-homepage-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply enhancements and create stable site mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          tag = '<script src="/homepage-enhancements.js" defer></script>'
          production_dir = Path('troncones_property_production_site 3')
          stable_dir = Path('site')

          js_path = Path('homepage-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          old_sharpen = "function sharpenHero(){const hero=document.querySelector('section.hero,.hero');if(!hero)return;hero.style.setProperty('filter','saturate(1.04) contrast(1.16) brightness(1.05)','important');hero.style.setProperty('-webkit-filter','saturate(1.04) contrast(1.16) brightness(1.05)','important');hero.style.setProperty('background-size','cover','important');hero.style.setProperty('background-position','center center','important')}"
          new_sharpen = """function sharpenHero(){
    const hero=document.querySelector('section.hero,.hero');if(!hero)return;
    if(hero.querySelector('.dt-hero-sharp-image'))return;
    const bg=getComputedStyle(hero).backgroundImage||hero.style.backgroundImage||'';
    const match=bg.match(/url\\([\"']?(.*?)[\"']?\\)/);
    if(!match||!match[1])return;
    const img=document.createElement('img');
    img.className='dt-hero-sharp-image';
    img.src=match[1];
    img.alt='Troncones Pacific coast';
    img.decoding='sync';
    img.fetchPriority='high';
    Object.assign(img.style,{position:'absolute',inset:'0',width:'100%',height:'100%',objectFit:'cover',objectPosition:'center center',zIndex:'0',display:'block',filter:'saturate(1.03) contrast(1.08) brightness(1.03)'});
    hero.style.setProperty('position','relative','important');
    hero.style.setProperty('background-image','none','important');
    hero.style.setProperty('filter','none','important');
    hero.style.setProperty('-webkit-filter','none','important');
    hero.insertBefore(img,hero.firstChild);
    [...hero.children].forEach(child=>{if(child!==img){child.style.position=child.style.position||'relative';child.style.zIndex=child.style.zIndex||'1'}});
  }"""
          if old_sharpen in js:
              js = js.replace(old_sharpen, new_sharpen)
          js_path.write_text(js, encoding='utf-8')

          shutil.copyfile('homepage-enhancements.js', production_dir / 'homepage-enhancements.js')

          # Listing cards are rendered from a JS template string. The click
          # handler must interpolate the actual listing code while rendering.
          old_clicks = [
              "onclick=\"location.href='listings/${p.code.toLowerCase()}.html'\"",
              "onclick=\"openDetail(p.code)\""
          ]
          new_click = "onclick=\"openDetail('${p.code}')\""
          old_keys = [
              "onkeydown=\"if(event.key==='Enter')location.href='listings/${p.code.toLowerCase()}.html'\"",
              "onkeydown=\"if(event.key==='Enter')openDetail(p.code)\""
          ]
          new_key = "onkeydown=\"if(event.key==='Enter')openDetail('${p.code}')\""

          for path in [Path('index.html'), production_dir / 'index.html']:
              html = path.read_text(encoding='utf-8')
              for old in old_clicks:
                  html = html.replace(old, new_click)
              for old in old_keys:
                  html = html.replace(old, new_key)
              html = html.replace(tag, '')
              if '</body>' in html:
                  html = html.replace('</body>', tag + '</body>', 1)
              else:
                  html += tag
              path.write_text(html, encoding='utf-8')

          if stable_dir.exists():
              shutil.rmtree(stable_dir)
          shutil.copytree(production_dir, stable_dir)

          for dirname in ['listings', 'assets']:
              src = production_dir / dirname
              dst = Path(dirname)
              if dst.exists():
                  shutil.rmtree(dst)
              if src.exists():
                  shutil.copytree(src, dst)
          for filename in ['404.html', 'robots.txt', 'sitemap.xml']:
              src = production_dir / filename
              if src.exists():
                  shutil.copyfile(src, Path(filename))
          PY

      - name: Commit generated production mirror
        run: |
          git config user.name "Discover Troncones Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html homepage-enhancements.js "troncones_property_production_site 3/index.html" "troncones_property_production_site 3/homepage-enhancements.js" site listings assets 404.html robots.txt sitemap.xml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Production mirror already current."
          else
            git commit -m "Sync complete Discover Troncones production site"
            git push origin main
          fi

      - name: Package production site
        uses: actions/upload-artifact@v4
        with:
          name: discover-troncones-production
          path: site/
          include-hidden-files: true
          retention-days: 1
