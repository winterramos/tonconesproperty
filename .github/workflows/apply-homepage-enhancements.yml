name: Apply homepage enhancements

on:
  push:
    branches: [main]
    paths:
      - 'homepage-enhancements.js'
      - '.github/workflows/apply-homepage-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Inject homepage enhancement script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="/homepage-enhancements.js" defer></script>'

          # Keep this idempotent if the workflow is run again later.
          html = html.replace(tag, '')
          if '</body>' in html:
              html = html.replace('</body>', tag + '</body>', 1)
          else:
              html += tag

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit generated homepage
        run: |
          git config user.name "Discover Troncones Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage already contains the enhancement script."
          else
            git commit -m "Apply homepage realtor and category photo enhancements"
            git push origin main
          fi
